[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pertinence-reproduction"
version = "0.1.0"
description = "CIFAR-10 reproduction scaffold for PERTINENCE"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pymoo==0.6.1.3",
  "PyYAML==6.0.2",
  "thop==0.1.1.post2209072238",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
pipeline = [
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "pyarrow==19.0.1",
]
kfp = ["kfp==2.12.1"]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[project.scripts]
pertinence = "pertinence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/pertinence/tests"]
addopts = "-ra"
markers = ["integration: requires downloaded assets and PyTorch"]

[tool.ruff]
line-length = 100
target-version = "py311"
