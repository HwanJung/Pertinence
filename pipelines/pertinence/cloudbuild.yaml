steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform
      - linux/amd64
      - --file
      - pipelines/pertinence/Dockerfile
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
logsBucket: gs://${_LOG_BUCKET}/cloud-build/${_EXPERIMENT_ID}/logs
options:
  logging: GCS_ONLY
