timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: asia-northeast3-docker.pkg.dev/pertinence-509116/pertinence/demo:replace
  _PYTHON_BASE_IMAGE: replace-with-python-3.11-slim-digest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --file=cloud/demo/Dockerfile
      - --build-arg=PYTHON_BASE_IMAGE=${_PYTHON_BASE_IMAGE}
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
